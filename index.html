<!DOCTYPE html>
<html>
<head>
    <title>MedSync Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { display: block; margin: 10px 0; padding: 8px; width: 100%; max-width: 300px; }
        button { background: #2563EB; color: white; border: none; cursor: pointer; }
        .urgent { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <h1>MedSync Backend Tester</h1>

    <div class="card">
        <h2>Test Login</h2>
        <input type="email" id="loginEmail" placeholder="Email (admin@apollo.com)">
        <input type="password" id="loginPass" placeholder="Password (password123)">
        <select id="loginRole">
            <option value="hospital">Hospital</option>
            <option value="donor">Donor</option>
            <option value="ngo">NGO</option>
        </select>
        <button onclick="testLogin()">Login</button>
        <p id="loginResult"></p>
    </div>

    <div class="card">
        <h2>Test Add Donation (Medicine or Blood)</h2>
        <input type="text" id="medName" placeholder="Medicine Name or 'Blood'">
        <input type="date" id="expiry">
        <input type="number" id="qty" placeholder="Quantity">
        <select id="bloodGroup">
            <option value="N/A">N/A (Medicine)</option>
            <option value="A+">A+</option>
            <option value="O+">O+</option>
            <option value="B-">B-</option>
        </select>
        <button onclick="testAdd()">Submit Donation</button>
    </div>

    <div class="card">
        <h2>Live Data from Database</h2>
        <button onclick="loadData()">Refresh List</button>
        <div id="dataList"></div>
    </div>

    <script>
        const API_URL = "http://localhost:5000";

        // FUNCTION TO LOGIN
        async function testLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const role = document.getElementById('loginRole').value;

            const res = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password, role })
            });
            const data = await res.json();
            document.getElementById('loginResult').innerText = data.message || "Error";
        }

        // FUNCTION TO ADD DONATION
        async function testAdd() {
            const body = {
                donor_id: 1,
                medicine_name: document.getElementById('medName').value,
                expiry_date: document.getElementById('expiry').value,
                quantity: document.getElementById('qty').value,
                blood_group: document.getElementById('bloodGroup').value
            };

            const res = await fetch(`${API_URL}/add-donation`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            if(res.ok) alert("Added successfully!");
            loadData();
        }

        // FUNCTION TO VIEW DATA
        async function loadData() {
            const res = await fetch(`${API_URL}/view-donations`);
            const data = await res.json();
            const container = document.getElementById('dataList');
            container.innerHTML = data.map(item => `
                <p>
                    <b>${item.medicine_name}</b> - ${item.quantity} units 
                    (Blood: ${item.blood_group}) - 
                    <span class="${item.priority_status === 'URGENT' ? 'urgent' : ''}">${item.priority_status}</span>
                </p>
            `).join('');
        }
    </script>
</body>
</html>
