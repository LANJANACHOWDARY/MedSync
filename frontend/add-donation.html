<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="sidebar">
        <div class="logo">🛡️ MedSync</div>
        <div class="nav-menu">
            <a href="donor-dashboard.html">🏠 Overview</a>
            <a href="add-donation.html" class="active">➕ Add Donation</a>
            <a href="my-donations.html">📦 My Donations</a>
        </div>
    </div>
    <div class="main">
        <h2>Add Donation</h2>
        <div style="background:white; padding:30px; border-radius:12px; max-width:500px; margin-top:20px;">
            <form onsubmit="handleDonation(event)">
                <div class="field"><label>Medicine Name</label><input type="text" required></div>
                <div class="field"><label>Quantity</label><input type="number" required></div>
                <div class="field"><label>Expiry Date</label><input type="date" required></div>
                <div class="field">
                    <label>Blood Group</label>
                    <select>
                        <option>N/A</option>
                        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                        <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                    </select>
                </div>
                <button class="btn">Submit Donation</button>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
