<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <div><h1 class="reveal shadow-heading">Medical Portal</h1></div>
        </div>
        <div class="auth-right">
            <h2 class="reveal">Hospital Registration</h2>
            <form id="regForm" action="hospital-dashboard.html" method="POST" class="reveal">
                <div class="field"><label>Hospital Name</label><input type="text" name="hosp_name" required></div>
                <div class="field"><label>Email ID</label><input type="email" name="email" required></div>
                <div class="field"><label>Password</label><input type="password" name="password" required></div>
                <div class="field"><label>Location</label><input type="text" name="location" required></div>
                <button type="submit" class="btn">Register Hospital</button>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
    <script>
        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = 'hospital-dashboard.html';
        };
    </script>
</body>
</html>
