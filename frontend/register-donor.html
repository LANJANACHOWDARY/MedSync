<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="style.css"></head>
<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <div><h1 class="reveal shadow-heading">Join Our Network</h1></div>
        </div>
        <div class="auth-right">
            <h2 class="reveal">Donor Registration</h2>
            <form id="regForm" action="donor-dashboard.html" method="POST" class="reveal">
                <div class="field"><label>Username</label><input type="text" name="username" required></div>
                <div class="field"><label>Email Address</label><input type="email" name="email" required></div>
                <div class="field"><label>Password</label><input type="password" name="password" required></div>
                <div class="field"><label>Location</label><input type="text" name="location" required></div>
                <button type="submit" class="btn">Create Donor Account</button>
            </form>
        </div>
    </div>
    <script src="index.js"></script>
    <script>
        // Redirect logic for frontend testing
        document.getElementById('regForm').onsubmit = function(e) {
            e.preventDefault();
            window.location.href = 'donor-dashboard.html';
        };
    </script>
</body>
</html>
